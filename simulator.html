<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <title>Merchant Portal Simulator</title>

  <link rel="stylesheet" href="./academy.css">

  <style>
    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f5f7;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .sim-top {
      flex: 0 0 68px;
      width: 100vw !important;
      min-width: 100vw !important;
      max-width: none !important;
      margin: 0 !important;
      box-sizing: border-box;
    }

    #simulatorFrame {
      display: block !important;
      flex: 1 1 auto !important;

      width: 100vw !important;
      min-width: 100vw !important;
      max-width: none !important;

      height: calc(100vh - 68px) !important;
      min-height: 0 !important;
      max-height: none !important;

      margin: 0 !important;
      padding: 0 !important;

      border: 0 !important;
      outline: 0 !important;

      background: #fff;

      box-sizing: border-box;
    }
  </style>
</head>

<body
  data-page="simulator"
  class="sim-shell"
>

  <header class="sim-top">

    <button
      id="backAcademy"
      class="btn small"
      type="button"
    >
      ← Volver a la Academia
    </button>

    <div>
      <b>Merchant Portal Simulator</b>

      <div class="tiny muted">
        Archivo grande permanece intacto
      </div>
    </div>

    <div class="spacer"></div>

    <span
      class="presence online"
    >
      <i
        id="syncDot"
        class="sync-dot"
      ></i>

      <span
        id="syncText"
      >
        Conectando progreso...
      </span>
    </span>

    <span
      id="simUser"
      class="tiny muted"
    ></span>

    <button
      id="simLogout"
      class="btn small"
      type="button"
    >
      Cerrar sesión
    </button>

  </header>

  <iframe
    id="simulatorFrame"
    class="sim-frame"
    title="DoorDash Merchant Portal Training Simulator"
    src=""
  ></iframe>

  <div
    id="fatalMessage"
    class="message"
  ></div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script src="./firebase-config.js"></script>

  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>

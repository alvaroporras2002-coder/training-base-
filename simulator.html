<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <title>Merchant Portal Simulator</title>

  <link rel="stylesheet" href="./academy.css">

  <style>
    /* ======================================================
       HARD RESET
       ====================================================== */

    html {
      width: 100% !important;
      min-width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      min-height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    body {
      position: relative !important;

      width: 100vw !important;
      min-width: 100vw !important;
      max-width: none !important;

      height: 100vh !important;
      min-height: 100vh !important;
      max-height: none !important;

      margin: 0 !important;
      padding: 0 !important;

      overflow: hidden !important;

      display: block !important;

      background: #f4f5f7 !important;
    }

    /* ======================================================
       TOP BAR
       ====================================================== */

    .sim-top {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;
      right: 0 !important;

      width: 100vw !important;
      min-width: 100vw !important;
      max-width: none !important;

      height: 68px !important;
      min-height: 68px !important;
      max-height: 68px !important;

      margin: 0 !important;
      padding: 0 18px !important;

      z-index: 99999 !important;

      display: flex !important;
      align-items: center !important;

      box-sizing: border-box !important;

      background: #ffffff !important;
      border-bottom: 1px solid #e5e5e5 !important;

      overflow: hidden !important;
    }

    .sim-top .spacer {
      flex: 1 1 auto !important;
    }

    .sim-top > * {
      flex-shrink: 0 !important;
    }

    /* ======================================================
       FRAME
       ====================================================== */

    #simulatorFrame {
      position: fixed !important;

      top: 68px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;

      width: 100vw !important;
      min-width: 100vw !important;
      max-width: none !important;

      height: calc(100vh - 68px) !important;
      min-height: calc(100vh - 68px) !important;
      max-height: none !important;

      margin: 0 !important;
      padding: 0 !important;

      border: 0 !important;
      outline: 0 !important;

      display: block !important;

      box-sizing: border-box !important;

      background: #ffffff !important;

      z-index: 1 !important;

      overflow: auto !important;
    }

    /* ======================================================
       MESSAGES
       ====================================================== */

    #fatalMessage,
    #toast {
      z-index: 100000 !important;
    }

    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 760px) {

      .sim-top {
        height: 60px !important;
        min-height: 60px !important;
        max-height: 60px !important;

        padding: 0 10px !important;
      }

      #simulatorFrame {
        top: 60px !important;

        height: calc(100vh - 60px) !important;
        min-height: calc(100vh - 60px) !important;
      }
    }
  </style>
</head>

<body
  class="sim-shell"
  data-page="simulator"
>

  <header class="sim-top">

    <button
      id="backAcademy"
      class="btn small"
      type="button"
    >
      ← Volver a la Academia
    </button>

    <div>
      <b>Merchant Portal Simulator</b>

      <div class="tiny muted">
        El archivo grande permanece intacto
      </div>
    </div>

    <div class="spacer"></div>

    <span class="presence online">
      <i
        id="syncDot"
        class="sync-dot"
      ></i>

      <span id="syncText">
        Conectando progreso...
      </span>
    </span>

    <span
      id="simUser"
      class="tiny muted"
    ></span>

    <button
      id="simLogout"
      class="btn small"
      type="button"
    >
      Cerrar sesión
    </button>

  </header>

  <iframe
    id="simulatorFrame"
    title="DoorDash Merchant Portal Training Simulator"
    src=""
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <div
    id="fatalMessage"
    class="message"
  ></div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script src="./firebase-config.js"></script>

  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
